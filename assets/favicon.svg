<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF14" />
      <stop offset="100%" stop-color="#00aa22" />
    </linearGradient>
  </defs>
  <!-- Background Shield Shape -->
  <rect width="64" height="64" rx="14" fill="#080B09"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#39FF14" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Cyber Shield -->
  <path d="M32 10L48 16V28C48 38 41 47 32 52C23 47 16 38 16 28V16L32 10Z" 
        stroke="url(#cyberGrad)" stroke-width="2.5" fill="#0d140f" filter="url(#neonGlow)"/>
  <!-- Terminal Prompt inside shield -->
  <path d="M25 26L30 31L25 36" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="33" y1="36" x2="39" y2="36" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round"/>
</svg>

